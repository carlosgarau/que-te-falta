name: Consultar estado de App Store

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-status:
    name: Leer estado de Apple
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APPLE_APP_ID: "6800699896"
      APPLE_APP_VERSION: "1.0"
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Consultar App Store Connect
        run: node scripts/check-app-store-status.mjs
