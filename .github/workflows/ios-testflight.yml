name: Preparar o subir ¿Qué te falta? a TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Número de compilación; vacío usa el número de ejecución"
        required: false
        default: "13"
        type: string
      upload:
        description: "Validar y subir el IPA a TestFlight"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: la-compra-testflight
  cancel-in-progress: false

jobs:
  archive:
    name: Firmar, validar y preparar TestFlight
    runs-on: macos-26
    timeout-minutes: 45
    environment: app-store
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      BUNDLE_ID: com.carlosgarau.lacompra
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number }}

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Confirmar Xcode y SDK
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar pnpm
        run: npm install --global pnpm@11.16.0

      - name: Instalar y validar
        run: |
          pnpm install --no-frozen-lockfile
          pnpm run check
          pnpm run check:app-store
          pnpm run ios:sync

      - name: Comprobar secretos necesarios
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_TEAM_ID APPLE_CERTIFICATE_P12_BASE64 APPLE_CERTIFICATE_PASSWORD APPLE_API_PRIVATE_KEY APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Falta el secreto $name" >&2
              exit 1
            fi
          done

      - name: Preparar clave de App Store Connect
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Descargar perfil App Store vigente
        shell: bash
        run: |
          set -euo pipefail
          export PROFILE_PATH="$RUNNER_TEMP/app-store.mobileprovision"
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, time, urllib.parse, urllib.request

          def b64url(data):
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode("ascii")

          def read_length(data, offset):
              value = data[offset]
              offset += 1
              if value < 128:
                  return value, offset
              size = value & 0x7F
              return int.from_bytes(data[offset:offset + size], "big"), offset + size

          now = int(time.time())
          header = {"alg": "ES256", "kid": os.environ["APPLE_API_KEY_ID"], "typ": "JWT"}
          payload = {
              "iss": os.environ["APPLE_API_ISSUER_ID"],
              "iat": now - 30,
              "exp": now + 900,
              "aud": "appstoreconnect-v1",
          }
          message = f"{b64url(json.dumps(header, separators=(',', ':')).encode())}.{b64url(json.dumps(payload, separators=(',', ':')).encode())}".encode()
          signature = subprocess.run(
              ["openssl", "dgst", "-sha256", "-sign", os.environ["APPLE_API_KEY_PATH"]],
              input=message,
              check=True,
              stdout=subprocess.PIPE,
          ).stdout
          if signature[0] != 0x30:
              raise RuntimeError("Firma ECDSA no válida")
          _, pos = read_length(signature, 1)
          if signature[pos] != 0x02:
              raise RuntimeError("Firma ECDSA sin componente R")
          r_len, pos = read_length(signature, pos + 1)
          r = int.from_bytes(signature[pos:pos + r_len], "big")
          pos += r_len
          if signature[pos] != 0x02:
              raise RuntimeError("Firma ECDSA sin componente S")
          s_len, pos = read_length(signature, pos + 1)
          s = int.from_bytes(signature[pos:pos + s_len], "big")
          token = f"{message.decode()}.{b64url(r.to_bytes(32, 'big') + s.to_bytes(32, 'big'))}"

          query = urllib.parse.urlencode({
              "filter[profileType]": "IOS_APP_STORE",
              "filter[profileState]": "ACTIVE",
              "filter[name]": "La compra App Store",
              "fields[profiles]": "name,profileContent,uuid,profileState,profileType",
              "limit": "200",
          })
          request = urllib.request.Request(
              f"https://api.appstoreconnect.apple.com/v1/profiles?{query}",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              profiles = json.load(response).get("data", [])
          matches = [
              profile for profile in profiles
              if profile.get("attributes", {}).get("name") == "La compra App Store"
          ]
          if len(matches) != 1:
              raise RuntimeError(f"Se esperaba un perfil App Store activo y se encontraron {len(matches)}")
          content = matches[0]["attributes"]["profileContent"]
          pathlib.Path(os.environ["PROFILE_PATH"]).write_bytes(base64.b64decode(content))
          PY
          echo "PROFILE_PATH=$PROFILE_PATH" >> "$GITHUB_ENV"

      - name: Instalar certificado y perfil de distribución
        shell: bash
        run: |
          set -euo pipefail
          export CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          export PROFILE_PLIST="$RUNNER_TEMP/app-store-profile.plist"
          export KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          export KEYCHAIN_PASSWORD="$(uuidgen)"

          python3 - <<'PY'
          import base64, os, pathlib
          pathlib.Path(os.environ["CERTIFICATE_PATH"]).write_bytes(
              base64.b64decode(os.environ["APPLE_CERTIFICATE_P12_BASE64"])
          )
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$PROFILE_PLIST")"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Crear archivo firmado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/LaCompra.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            clean archive | tee build/archive.log

      - name: Exportar IPA
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath build/LaCompra.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" | tee build/export.log

          IPA_PATH="$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)"
          if [[ -z "$IPA_PATH" ]]; then
            echo "No se generó el IPA" >&2
            exit 1
          fi
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"

      - name: Validar con App Store Connect
        if: ${{ inputs.upload }}
        run: |
          xcrun altool --validate-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

      - name: Subir a TestFlight
        if: ${{ inputs.upload }}
        run: |
          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$APPLE_API_KEY_ID" \
            --apiIssuer "$APPLE_API_ISSUER_ID"

      - name: Guardar IPA y registros
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: la-compra-ios-${{ env.BUILD_NUMBER }}
          path: |
            build/export/*.ipa
            build/archive.log
            build/export.log
          if-no-files-found: warn
          retention-days: 7

      - name: Limpiar credenciales temporales
        if: always()
        shell: bash
        run: |
          if [[ -n "${PROFILE_UUID:-}" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then
            rm -f "$APPLE_API_KEY_PATH"
          fi
          if [[ -n "${KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi
