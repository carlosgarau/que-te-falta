name: Comprobar iOS con Xcode 26

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios-xcode26.yml"
      - "ios/**"
      - "scripts/**"
      - "*.html"
      - "*.mjs"
      - "*.json"
      - "pnpm-lock.yaml"
      - "styles.css"
  pull_request:
    paths:
      - ".github/workflows/ios-xcode26.yml"
      - "ios/**"
      - "scripts/**"
      - "*.html"
      - "*.mjs"
      - "*.json"
      - "pnpm-lock.yaml"
      - "styles.css"

permissions:
  contents: read

concurrency:
  group: ios-xcode26-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Compilar sin firma
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Confirmar Xcode 26
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar pnpm
        run: npm install --global pnpm@11.16.0

      - name: Instalar dependencias
        run: pnpm install --no-frozen-lockfile

      - name: Ejecutar pruebas
        run: |
          pnpm run check
          pnpm run check:app-store

      - name: Preparar el proyecto iOS
        run: pnpm run ios:sync

      - name: Probar el motor nativo de Siri
        run: swift scripts/test-siri-core.swift

      - name: Mostrar la configuración de Xcode
        run: xcodebuild -project ios/App/App.xcodeproj -list

      - name: Compilar para el simulador
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build-xcode26.log

      - name: Guardar resultado y registro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: la-compra-xcode26-${{ github.run_number }}
          path: |
            build-xcode26.log
            build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: warn
          retention-days: 7
